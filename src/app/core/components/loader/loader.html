<div class="loader-overlay"
     [class.is-active]="loading.isLoading()">
  
  <!-- Resplandor cálido de café de fondo -->
  <div class="absolute w-[28rem] h-[28rem] rounded-full bg-[#BA8353]/15 blur-3xl pointer-events-none animate-pulse-subtle"></div>

  <!-- Contenedor del Logo con halo rotatorio -->
  <div class="relative mb-6">
    <!-- Haz cónico giratorio alrededor del logo -->
    <div class="absolute -inset-3.5 rounded-full loader-spinning-ring"></div>
    
    <!-- Aura pulsante en tonos café -->
    <div class="absolute -inset-2 rounded-full bg-gradient-to-r from-[#D7A779] via-[#BA8353] to-[#8E5836] opacity-60 blur-xl animate-pulse-subtle"></div>
    
    <!-- Logo oficial de la cafetería -->
    <div class="relative w-28 h-28 sm:w-32 sm:h-32 rounded-full overflow-hidden border-2 border-[#D7A779]/60 bg-[#140E0B] p-2 shadow-2xl flex items-center justify-center">
      <img src="/assets/museo/logo_cafeteria.png" alt="Café Ayacuchano" class="w-full h-full object-contain animate-float" />
    </div>
  </div>

  <!-- Título y subtítulo oficial -->
  <h2 class="font-['Bebas_Neue'] text-3xl sm:text-4xl tracking-widest uppercase text-[#FFF8F1] leading-none mb-2">
    CAFÉ <span class="cafe-gradient-text">AYACUCHANO</span>
  </h2>
  
  <p class="text-xs text-[#D7A779]/80 font-['Outfit'] font-semibold tracking-wider uppercase mb-5">
    Cosecha de grano de altura • Tostado Artesanal
  </p>

  <!-- Barra de progreso fluida en tonos caramelo y crema -->
  <div class="w-48 h-1 bg-white/10 rounded-full overflow-hidden relative">
    <div class="absolute inset-y-0 loader-bar-slide bg-gradient-to-r from-[#D7A779] via-[#FFF8F1] to-[#BA8353] rounded-full"></div>
  </div>
</div>
