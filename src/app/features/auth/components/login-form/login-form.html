<form (submit)="onSubmit($event)" class="space-y-4">
  <div>
    <label class="block text-[11px] font-['Outfit'] font-bold uppercase tracking-wider text-[#D2A375] mb-1.5">
      Correo Electrónico
    </label>
    <div class="relative">
      <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#D2A375]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <input type="email" [(ngModel)]="email" name="email" required
             placeholder="tu_correo@ejemplo.com"
             class="w-full pl-10 pr-4 py-2.5 rounded-xl glass-panel text-xs text-[#F5EBE1] placeholder-stone-400 border border-[#D2A375]/25 focus:border-[#B48559] outline-none transition-all" />
    </div>
  </div>

  <div>
    <label class="block text-[11px] font-['Outfit'] font-bold uppercase tracking-wider text-[#D2A375] mb-1.5">
      Contraseña
    </label>
    <div class="relative">
      <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#D2A375]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" [(ngModel)]="pass" name="pass" required
             placeholder="••••••••"
             (focus)="onPasswordFocus(true)"
             (blur)="onPasswordFocus(false)"
             class="w-full pl-10 pr-4 py-2.5 rounded-xl glass-panel text-xs text-[#F5EBE1] placeholder-stone-400 border border-[#D2A375]/25 focus:border-[#B48559] outline-none transition-all" />
    </div>
  </div>

  <button type="submit" 
          class="w-full py-3 rounded-xl bg-[#B48559] hover:bg-[#9B6C40] active:scale-[0.98] text-xs font-['Outfit'] font-bold uppercase tracking-wider text-white shadow-lg transition-all cursor-pointer border border-[#D2A375]/30">
    Iniciar Sesión
  </button>

  <div class="pt-4 border-t border-white/10">
    <div class="text-[10px] font-['Outfit'] font-bold uppercase tracking-wider text-[#D2A375] text-center mb-2">
      Cuentas Rápidas de Prueba
    </div>
    <div class="grid grid-cols-3 gap-2">
      <button type="button" (click)="email = 'priat@gmail.com'"
              class="px-2 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-[10px] font-medium text-[#D2A375] transition-all cursor-pointer">
        Cliente
      </button>
      <button type="button" (click)="email = 'nelly@gmail.com'"
              class="px-2 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-[10px] font-medium text-[#D2A375] transition-all cursor-pointer">
        Barista
      </button>
      <button type="button" (click)="email = 'jackramos@gmail.com'"
              class="px-2 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-[10px] font-medium text-[#D2A375] transition-all cursor-pointer">
        Admin
      </button>
    </div>
  </div>
</form>
