<div class="flex flex-wrap items-center justify-center gap-2 md:gap-3 py-6">
  @for (cat of categories; track cat) {
    <button (click)="select(cat)"
            [class.bg-gradient-to-r]="active === cat"
            [class.from-[#D7A779]]="active === cat"
            [class.to-[#BA8353]]="active === cat"
            [class.border-[#FFF8F1]/50]="active === cat"
            [class.text-[#140E0B]]="active === cat"
            [class.shadow-xl]="active === cat"
            [class.shadow-[#BA8353]/35]="active === cat"
            [class.scale-105]="active === cat"
            [class.glass-panel]="active !== cat"
            [class.text-[#D7A779]]="active !== cat"
            [class.hover:border-[#D7A779]/70]="active !== cat"
            [class.hover:text-[#FFF8F1]]="active !== cat"
            class="px-5 py-2.5 rounded-full border text-xs font-['Outfit'] font-black tracking-wider uppercase transition-all duration-300 cursor-pointer flex items-center gap-2 hover:-translate-y-1 hover:scale-105 active:scale-95">
      @if (cat === 'Todos') {
        <svg class="w-3.5 h-3.5 transition-transform" [class.text-[#140E0B]]="active === cat" [class.text-[#D7A779]]="active !== cat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      } @else if (cat === 'Café en Grano') {
        <svg class="w-3.5 h-3.5 transition-transform" [class.text-[#140E0B]]="active === cat" [class.text-[#D7A779]]="active !== cat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      } @else if (cat === 'Bebidas de Barra') {
        <svg class="w-3.5 h-3.5 transition-transform" [class.text-[#140E0B]]="active === cat" [class.text-[#D7A779]]="active !== cat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>
      } @else if (cat === 'Métodos Filtrados') {
        <svg class="w-3.5 h-3.5 transition-transform" [class.text-[#140E0B]]="active === cat" [class.text-[#D7A779]]="active !== cat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16l-6 8v6l-4 2v-8z"/></svg>
      } @else {
        <svg class="w-3.5 h-3.5 transition-transform" [class.text-[#140E0B]]="active === cat" [class.text-[#D7A779]]="active !== cat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s2-1 4-1 4 1 4 1 2-1 4-1 4 1 4 1"/><path d="M2 21h20"/><circle cx="12" cy="7" r="4"/></svg>
      }
      <span>{{ cat }}</span>
    </button>
  }
</div>
